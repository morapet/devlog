# devlog + Cloudflare Tunnel: HTTPS URL with no open ports — works on a home
# machine behind any router/NAT. See README.md in this directory.
services:
  devlog:
    image: ghcr.io/morapet/devlog:latest
    restart: unless-stopped
    environment:
      # The tunnel reaches devlog as a non-loopback client, so devlog already
      # requires its shared secret here. Pin it to a known value; otherwise
      # it's auto-generated (read it with `devlog --print-token`). Leave unset
      # to auto-generate, or if you rely solely on Cloudflare Access.
      DEVLOG_AUTH_TOKEN: ${DEVLOG_AUTH_TOKEN:-}
    volumes:
      - ./data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
